<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>さかたなおきです</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: linear-gradient(135deg, #fff3e0, #ffe0b2, #ffcc80);
      color: #5d4037;
      text-align: center;
      padding: 24px;
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      border: 2px solid #ffb74d;
      border-radius: 24px;
      padding: 56px 40px;
      box-shadow: 0 12px 32px rgba(230, 126, 34, 0.25);
      max-width: 560px;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      color: #e65100;
      letter-spacing: 0.04em;
    }

    p {
      margin-top: 18px;
      font-size: 1.15rem;
      color: #8d6e63;
    }

    .accent {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 22px;
      border-radius: 999px;
      background: #ff9800;
      color: #fff;
      font-weight: bold;
      box-shadow: 0 6px 14px rgba(255, 152, 0, 0.35);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>さかたなおきです。</h1>
    <p>よろしくお願いします。</p>
    <span class="accent">ようこそ</span>
  </main>
</body>
</html>
